services:
  - type: web
    name: gu-insight
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite.db
      - key: PORT
        value: "10000"
